<div class="card" data-chart-id="K" data-width="100" data-locked="false">
    <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
        <span>{{ t.chart_tax_breakdown }}</span>
        <div class="chart-edit-controls">
            <button class="chart-ctrl-btn lock-btn">🔓</button>
            <button class="chart-ctrl-btn width-btn" title="toggle width">⬜⬜</button>
            <button class="chart-ctrl-btn hide-btn">×</button>
        </div>
    </div>
    <div class="tax-donut-canvas-wrap">
        <canvas id="taxDonutChart" role="img" aria-label="{{ t.chart_tax_breakdown }}"></canvas>
    </div>
</div>
<script>
(function() {
    function css(v) {
        return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    }

    var salesSummary    = {{ sales_summary|tojson }};
    var potentialTaxData = {{ potential_tax_data|tojson if potential_tax_data is defined and potential_tax_data else 'null' }};
    var gains        = salesSummary.total_gains || 0;
    var lossOffset   = salesSummary.tax_offset_from_losses || 0;
    var netTax       = salesSummary.net_tax || 0;
    var potentialTax = potentialTaxData ? (potentialTaxData.potential_tax || 0) : 0;

    requestAnimationFrame(function() {
        var el = document.getElementById('taxDonutChart');
        if (!el) return;

        var statCards = document.querySelector('.tax-stat-cards');
        if (statCards) {
            var card = el.closest('.card');
            var cardHeader = card ? card.querySelector('.card-header') : null;
            var headerH = cardHeader ? cardHeader.offsetHeight : 0;
            var cs = card ? getComputedStyle(card) : null;
            var padT = cs ? parseFloat(cs.paddingTop) || 0 : 0;
            var padB = cs ? parseFloat(cs.paddingBottom) || 0 : 0;
            var availH = statCards.offsetHeight - headerH - padT - padB;
            if (availH > 60) {
                el.parentElement.style.height = availH + 'px';
                el.parentElement.style.maxHeight = 'none';
            }
        }

        var taxDonut = new Chart(el.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: [T.label_gross_gains, T.label_loss_offset, T.label_net_tax, T.label_potential_tax],
                datasets: [{
                    data: [gains, lossOffset, netTax, potentialTax],
                    backgroundColor: [css('--positive') + 'cc', css('--text-secondary') + 'cc', css('--negative') + 'cc', '#f0883ecc'],
                    borderColor: css('--bg-secondary'),
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { color: css('--text-primary'), padding: 16, boxWidth: 14 }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(ctx) {
                                return ctx.label + ': ₪' + ctx.parsed.toLocaleString('he-IL', {maximumFractionDigits: 0});
                            }
                        }
                    }
                }
            }
        });

        new ResizeObserver(function() { taxDonut.resize(); }).observe(el.parentElement);

        new MutationObserver(function() {
            taxDonut.data.datasets[0].backgroundColor = [css('--positive') + 'cc', css('--text-secondary') + 'cc', css('--negative') + 'cc', '#f0883ecc'];
            taxDonut.data.datasets[0].borderColor = css('--bg-secondary');
            taxDonut.options.plugins.legend.labels.color = css('--text-primary');
            taxDonut.update();
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    });
})();
</script>
