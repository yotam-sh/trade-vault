<div class="card" data-chart-id="I" data-width="100" data-locked="false">
    <div class="card-header">
        <span>{{ t.chart_daily_pnl }}</span>
        <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
            <div class="unit-switch" id="pnlUnitToggle" data-active="ils">
                <button class="lang-option active" data-unit="ils" aria-pressed="true">{{ currency_symbol }}</button>
                <button class="lang-option" data-unit="pct" aria-pressed="false">%</button>
            </div>
            <div class="chart-edit-controls">
                <button class="chart-ctrl-btn lock-btn">🔓</button>
                <button class="chart-ctrl-btn width-btn" title="toggle width">⬜⬜</button>
                <button class="chart-ctrl-btn hide-btn">×</button>
            </div>
        </div>
    </div>
    <canvas id="dailyPnlChart" role="img" aria-label="{{ t.chart_daily_pnl }}" style="max-height: 220px;"></canvas>
</div>
<script>
(function() {
    var allDailyData = {{ data|tojson }};

    function css(v) {
        return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    }

    function getFiltered(period) {
        if (period === 0) return allDailyData;
        if (period === -1) {
            var yr = new Date().getFullYear().toString();
            return allDailyData.filter(function(d) { return d.date >= yr + '-01-01'; });
        }
        return allDailyData.slice(-period);
    }

    var activePeriod = 7;
    var activeUnit   = 'ils';

    function getActiveData() { return getFiltered(activePeriod); }

    function buildColors(vals) {
        return {
            bg:     vals.map(function(v) { return v >= 0 ? css('--positive') + 'cc' : css('--negative') + 'cc'; }),
            border: vals.map(function(v) { return v >= 0 ? css('--positive') : css('--negative'); }),
        };
    }

    function fmtValue(v) {
        if (activeUnit === 'pct') return v.toFixed(2) + '%';
        return '{{ currency_symbol }}' + v.toLocaleString('{{ number_locale }}', {maximumFractionDigits: 0});
    }

    function fmtTick(v) {
        if (activeUnit === 'pct') return v.toFixed(1) + '%';
        return '{{ currency_symbol }}' + v.toLocaleString('{{ number_locale }}', {maximumFractionDigits: 0});
    }

    function getDailyData(data, unit) {
        return {
            labels: data.map(function(d) { return d.date; }),
            values: data.map(function(d) { return unit === 'pct' ? d.change_pct : d.daily_pnl; }),
        };
    }

    requestAnimationFrame(function() {
        var ctx = document.getElementById('dailyPnlChart');
        if (!ctx) return;

        var init = getDailyData(getActiveData(), activeUnit);
        var initCols = buildColors(init.values);

        var yMinWidth = 0;

        var chart = new Chart(ctx.getContext('2d'), {
            type: 'bar',
            data: {
                labels: init.labels,
                datasets: [{
                    label: T.chart_daily_pnl,
                    data: init.values,
                    backgroundColor: initCols.bg,
                    borderColor: initCols.border,
                    borderWidth: 1,
                    borderRadius: 3,
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: function(ctx) { return fmtValue(ctx.parsed.y); } } }
                },
                scales: {
                    x: { ticks: { color: css('--text-secondary'), maxRotation: 45, maxTicksLimit: 20 }, grid: { color: css('--bg-tertiary') } },
                    y: {
                        ticks: { color: css('--text-secondary'), callback: function(v) { return fmtTick(v); } },
                        grid: { color: css('--bg-tertiary') },
                        afterFit: function(s) {
                            if (yMinWidth === 0) {
                                var curW = 0;
                                (s.ticks || []).forEach(function(tk) {
                                    var w = s.ctx.measureText(tk.label || '').width;
                                    if (w > curW) curW = w;
                                });
                                var maxOther = Math.max.apply(null, allDailyData.map(function(d) {
                                    return Math.abs(activeUnit === 'ils' ? (d.change_pct || 0) : (d.daily_pnl || 0));
                                }).concat([0]));
                                var otherLbl = activeUnit === 'ils'
                                    ? maxOther.toFixed(1) + '%'
                                    : '{{ currency_symbol }}' + maxOther.toLocaleString('{{ number_locale }}', {maximumFractionDigits: 0});
                                var otherW = s.ctx.measureText(otherLbl).width;
                                yMinWidth = Math.ceil(Math.max(curW, otherW)) + 16;
                            }
                            if (s.width < yMinWidth) s.width = yMinWidth;
                        }
                    }
                }
            }
        });
        chart.update('none');

        function refreshChart() {
            var d = getDailyData(getActiveData(), activeUnit);
            var cols = buildColors(d.values);
            chart.data.labels = d.labels;
            chart.data.datasets[0].data = d.values;
            chart.data.datasets[0].backgroundColor = cols.bg;
            chart.data.datasets[0].borderColor = cols.border;
            chart.update();
        }

        document.querySelectorAll('#pnlUnitToggle .lang-option').forEach(function(btn) {
            btn.addEventListener('click', function() {
                activeUnit = activeUnit === 'ils' ? 'pct' : 'ils';
                document.getElementById('pnlUnitToggle').setAttribute('data-active', activeUnit);
                document.querySelectorAll('#pnlUnitToggle .lang-option').forEach(function(b) {
                    var on = b.getAttribute('data-unit') === activeUnit;
                    b.classList.toggle('active', on);
                    b.setAttribute('aria-pressed', on ? 'true' : 'false');
                });
                refreshChart();
            });
        });

        function applyTheme() {
            var cols = buildColors(chart.data.datasets[0].data);
            chart.data.datasets[0].backgroundColor = cols.bg;
            chart.data.datasets[0].borderColor = cols.border;
            chart.options.scales.x.ticks.color = css('--text-secondary');
            chart.options.scales.x.grid.color  = css('--bg-tertiary');
            chart.options.scales.y.ticks.color = css('--text-secondary');
            chart.options.scales.y.grid.color  = css('--bg-tertiary');
            chart.update();
        }
        new MutationObserver(applyTheme)
            .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    });
})();
</script>
