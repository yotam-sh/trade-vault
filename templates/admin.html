{% extends 'base.html' %}
{% block title %}{{ t.admin_title }} · TradeVault{% endblock %}

{% block content %}
<div class="tv-page-head"><div><h1>{{ t.admin_title }}</h1></div></div>

<div class="tv-stack">
  <div class="tv-panel">
    <div class="tv-panel-head"><div class="tv-panel-title">{{ t.admin_export_title }}</div></div>
    <div class="tv-panel-body">
      <p class="tv-page-sub" style="margin:0 0 14px;">{{ t.admin_export_desc }}</p>
      <form action="/admin/db-export" method="GET">
        <button type="submit" class="tv-btn tv-btn-secondary">{{ t.admin_export_btn }}</button>
      </form>
    </div>
  </div>

  <div class="tv-panel">
    <div class="tv-panel-head"><div class="tv-panel-title">{{ t.admin_import_title }}</div></div>
    <div class="tv-panel-body">
      <p class="tv-page-sub" style="margin:0 0 14px;">{{ t.admin_import_desc }}</p>
      <form method="POST" action="/admin/db-import" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label for="backup_file" style="cursor:pointer;">
            <span class="tv-btn tv-btn-secondary">{{ t.admin_import_label }}</span>
            <input type="file" id="backup_file" name="backup_file" accept=".json" style="display:none;"
                   onchange="this.previousElementSibling.textContent = this.files[0]?.name || '{{ t.admin_import_label }}'">
          </label>
          <button type="submit" class="tv-btn tv-btn-glow" style="background:var(--negative); box-shadow:none;" onclick="return confirm('{{ t.admin_import_desc }}')">{{ t.admin_import_btn }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
