services:
  # One-shot permission fixer: runs as root ONLY to make the volume mountpoints
  # writable by the app's non-root user (uid 10001, see Dockerfile), then exits.
  # The app container waits for it to finish, then runs unprivileged. This fixes
  # both fresh volumes and pre-existing root-owned volumes, idempotently.
  tradevault-init:
    image: alpine:3.20
    user: "0:0"
    command: sh -c "mkdir -p /data/db /app/data && chown -R 10001:10001 /data/db /app/data"
    volumes:
      - tradevault_db:/data/db
      - tradevault_data:/app/data
    restart: "no"

  tradevault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradevault
    restart: unless-stopped
    depends_on:
      tradevault-init:
        condition: service_completed_successfully
    ports:
      - "${PORT:-2501}:2501"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - DEBUG=${DEBUG:-false}
      - DB_PATH=/data/db/db.json
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      # Per-session TOTP login (see .env.example). Empty TOTP_SECRET disables the gate.
      - TOTP_SECRET=${TOTP_SECRET:-}
      - SESSION_LIFETIME_HOURS=${SESSION_LIFETIME_HOURS:-12}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    volumes:
      # Persistent database — survives container restarts and upgrades
      - tradevault_db:/data/db
      # Persistent Excel uploads — your brokerage files live here
      - tradevault_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:2501/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  tradevault_db:
    driver: local
  tradevault_data:
    driver: local

# Volume ownership is handled automatically by the tradevault-init service above
# (runs as root once, chowns the volumes to uid 10001, exits). No manual host chown
# is needed — this works for both fresh and pre-existing root-owned volumes.

# TrueNAS ZFS pool override (optional):
# To store data on your ZFS pool for snapshot/backup benefits,
# replace the volumes section above with:
#
# volumes:
#   tradevault_db:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /mnt/pool/tradevault/db
#   tradevault_data:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /mnt/pool/tradevault/data
#
# Then create the directories on TrueNAS before first run:
#   mkdir -p /mnt/pool/tradevault/db /mnt/pool/tradevault/data
